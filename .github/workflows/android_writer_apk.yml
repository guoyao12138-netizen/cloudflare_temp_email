name: Build InkBlue Writer APK

on:
  push:
    branches:
      - claude/android-fiction-writing-app-wgpg3s
    paths:
      - "android-writer/**"
      - ".github/workflows/android_writer_apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-writer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          TAG="inkblue-writer-v${VERSION}"
          APK="inkblue-writer-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "墨蓝写作 InkBlue Writer v${VERSION}" \
              --notes "安卓网文创作 App。模仿纯纯写作的沉浸式写作体验，Claude 风格蓝色 UI。下载 APK 安装即可使用（调试签名，安装时需允许未知来源）。"
          fi
          gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber

  # GitHub retired free Intel mac runners (macos-13, Dec 2025), so the Intel
  # build is a cross-packaged uber-JAR produced on Linux: it bundles the
  # macos-x64 Skia natives and runs on Intel Macs with Java 17+.
  desktop-mac-intel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Intel-mac uber-JAR
        run: gradle packageUberJarForCurrentOS -PcomposeTarget=macx64 --no-daemon -p android-writer/desktop

      - name: Upload JAR to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android-writer/app/build.gradle.kts)
          TAG="inkblue-writer-v${VERSION}"
          JAR=$(ls android-writer/desktop/build/compose/jars/*.jar | head -n 1)
          cp "$JAR" "inkblue-writer-v${VERSION}-mac-intel.jar"
          gh release upload "$TAG" "inkblue-writer-v${VERSION}-mac-intel.jar" --repo "$GITHUB_REPOSITORY" --clobber

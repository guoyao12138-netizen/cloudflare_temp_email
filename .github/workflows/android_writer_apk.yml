name: Build InkBlue Writer APK

on:
  push:
    branches:
      - claude/android-fiction-writing-app-wgpg3s
    paths:
      - "android-writer/**"
      - ".github/workflows/android_writer_apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-writer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk inkblue-writer-v0.1.0-debug.apk
          if ! gh release view inkblue-writer-v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create inkblue-writer-v0.1.0 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "墨蓝写作 InkBlue Writer v0.1.0" \
              --notes "安卓网文创作 App。模仿纯纯写作的沉浸式写作体验，Claude 风格蓝色 UI。下载 APK 安装即可使用（调试签名，安装时需允许未知来源）。"
          fi
          gh release upload inkblue-writer-v0.1.0 inkblue-writer-v0.1.0-debug.apk --repo "$GITHUB_REPOSITORY" --clobber

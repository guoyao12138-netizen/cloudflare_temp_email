name: Build Android APK

on:
  push:
    branches: ["claude/android-vertex-ai-gcloud-auth-fytgh9", "main"]
    paths:
      - "android-vertex-ai/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-vertex-ai/**/*.gradle.kts', 'android-vertex-ai/gradle.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        working-directory: android-vertex-ai
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vertex-chat-debug
          path: android-vertex-ai/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

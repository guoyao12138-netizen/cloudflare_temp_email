name: Build Android APK

on:
  push:
    branches: ["claude/android-vertex-ai-gcloud-auth-fytgh9", "main"]
    paths:
      - "android-vertex-ai/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-vertex-ai/**/*.gradle.kts', 'android-vertex-ai/gradle.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        working-directory: android-vertex-ai
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with build number
        run: |
          mkdir -p dist
          cp android-vertex-ai/app/build/outputs/apk/debug/app-debug.apk \
             "dist/vertex-chat-build${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vertex-chat-build${{ github.run_number }}
          path: dist/vertex-chat-build${{ github.run_number }}.apk
          retention-days: 30

      - name: Publish Release
        if: github.ref == 'refs/heads/claude/android-vertex-ai-gcloud-auth-fytgh9'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Vertex Chat — build ${{ github.run_number }}
          body: |
            Vertex Chat Android APK (debug-signed, build ${{ github.run_number }}).

            Signing SHA-1: `6B:CF:B4:01:56:84:2F:F5:B4:98:31:D6:0F:FA:D5:44:2D:51:F5:1E`

            Download `vertex-chat-build${{ github.run_number }}.apk` below and install.
            The sign-in screen shows the version at the bottom so you can confirm
            you installed the right build.
          files: dist/vertex-chat-build${{ github.run_number }}.apk

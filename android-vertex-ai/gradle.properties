org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# ---------------------------------------------------------------------------
# OAuth redirect scheme used by AppAuth's RedirectUriReceiverActivity.
# This MUST be the *reversed* form of your Google OAuth client ID, e.g. a
# client ID of  123456-abc.apps.googleusercontent.com  becomes the scheme
#   com.googleusercontent.apps.123456-abc
# Override it here (or with -PappAuthRedirectScheme=...) after you create the
# OAuth client. See README.md for the full setup walkthrough.
# ---------------------------------------------------------------------------
appAuthRedirectScheme=com.googleusercontent.apps.REPLACE_WITH_REVERSED_CLIENT_ID
